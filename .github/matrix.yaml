# Build matrix for .github/workflows/build-and-publish.yml.
#
# Also the source of truth for distrobox.ini -- run scripts/gen-distrobox-ini.sh
# (or just pre-commit) after changing this file.

# Arch
- image-name: cider-arch
  base-image: ghcr.io/ublue-os/arch-toolbox:latest
  layers: cider
  context: arch
- image-name: emacs-arch
  base-image: ghcr.io/ublue-os/arch-toolbox:latest
  layers: emacs
  context: arch
- image-name: latex-arch
  base-image: ghcr.io/ublue-os/arch-toolbox:latest
  layers: latex
  context: arch
  free-disk-space: true
- image-name: emacs-ai-arch
  base-image: ghcr.io/ublue-os/arch-toolbox:latest
  layers: emacs,ai
  context: arch
- image-name: emacs-latex-arch
  base-image: ghcr.io/ublue-os/arch-toolbox:latest
  layers: emacs,latex
  context: arch
  free-disk-space: true
- image-name: emacs-latex-ai-arch
  base-image: ghcr.io/ublue-os/arch-toolbox:latest
  layers: emacs,latex,ai
  context: arch
  free-disk-space: true
- image-name: ai-arch
  base-image: ghcr.io/ublue-os/arch-toolbox:latest
  layers: ai
  context: arch
